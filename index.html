<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Transition Report</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:       #f5f2eb;
    --surface:  #fffdf8;
    --border:   #ddd8cc;
    --text:     #1a1714;
    --muted:    #7a7166;
    --add:      #1d5c35;
    --add-bg:   #eaf4ee;
    --add-bd:   #b0d9be;
    --frem:     #7a1f1f;
    --frem-bg:  #fdf0ef;
    --frem-bd:  #e8b4b0;
    --prem:     #7a4e00;
    --prem-bg:  #fdf6e8;
    --prem-bd:  #e8d0a0;
    --same-bg:  #f0ede6;
    --same-bd:  #ccc8bf;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }

  .report-header { background: var(--text); color: var(--bg); padding: 2.2rem 2rem 1.8rem; }
  .report-header-inner { max-width: 1000px; margin: 0 auto; }
  .report-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem,4vw,2.4rem); font-weight: 700; line-height: 1.1; }
  .report-header p  { font-size: .8rem; opacity: .5; margin-top: .4rem; font-family: 'DM Mono', monospace; }

  .report-body { max-width: 1000px; margin: 0 auto; padding: 2rem; }

  /* PICKER */
  .picker-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.25rem 1.5rem; margin-bottom: 2rem;
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  }
  .picker-group { display: flex; flex-direction: column; gap: .4rem; }
  .picker-group label { font-family: 'DM Mono', monospace; font-size: .68rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .rp-btns { display: flex; gap: 6px; }
  .rp-btn {
    width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: .85rem; font-family: 'DM Mono', monospace;
    color: var(--muted); background: var(--bg); transition: all .15s; font-weight: 500;
  }
  .rp-btn:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
  .rp-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .rp-btn:disabled { opacity: .25; cursor: not-allowed; }
  .picker-arrow { font-size: 1.4rem; color: var(--border); align-self: flex-end; padding-bottom: 6px; }
  .compare-label {
    margin-left: auto; font-family: 'Playfair Display', serif;
    font-size: 1.1rem; font-weight: 600; color: var(--text);
    align-self: flex-end; padding-bottom: 4px; min-width: 120px; text-align: right;
  }

  /* LEGEND */
  .legend { display: flex; gap: 1.25rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* SECTIONS */
  .section-block { margin-bottom: 1.6rem; }
  .sec-label {
    font-family: 'DM Mono', monospace; font-size: .68rem; font-weight: 500;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: .7rem; padding-bottom: .45rem; border-bottom: 1px solid var(--border);
  }

  .card-row { display: grid; gap: .7rem; grid-template-columns: repeat(4, minmax(0,1fr)); }
  @media (max-width: 640px) { .card-row { grid-template-columns: repeat(2, minmax(0,1fr)); } }

  .mcard { border-radius: 10px; padding: 1rem 1.1rem; border: 1px solid transparent; }
  .mcard .mlabel { font-size: .68rem; font-weight: 500; margin-bottom: .45rem; letter-spacing: .05em; text-transform: uppercase; }
  .mcard .mval   { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; line-height: 1; }
  .mcard .mval-sm { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .mcard .msub   { font-size: .7rem; margin-top: .35rem; opacity: .8; }

  .c-add  { background: var(--add-bg);  border-color: var(--add-bd);  color: var(--add); }
  .c-frem { background: var(--frem-bg); border-color: var(--frem-bd); color: var(--frem); }
  .c-prem { background: var(--prem-bg); border-color: var(--prem-bd); color: var(--prem); }
  .c-same { background: var(--same-bg); border-color: var(--same-bd); color: var(--text); }
  .c-same .mlabel, .c-same .msub { color: var(--muted); }

  /* NET ROW */
  .divider { height: 1px; background: var(--border); margin: 1.6rem 0; }
  .net-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .7rem; }
  @media (max-width: 640px) { .net-row { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .ncard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1.1rem; }
  .ncard .nlabel { font-family: 'DM Mono', monospace; font-size: .68rem; color: var(--muted); margin-bottom: .25rem; letter-spacing: .08em; text-transform: uppercase; }
  .ncard .nval   { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; }
  .pos { color: var(--add); }
  .neg { color: var(--frem); }
  .zer { color: var(--muted); }

  .note { font-size: .72rem; color: var(--muted); margin-top: 1.5rem; line-height: 1.6;
    padding: .75rem 1rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font-family: 'DM Mono', monospace; }
  .note strong { color: var(--text); }

  .generated-note { font-size: .68rem; color: var(--muted); text-align: right; margin-top: 2rem; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<div class="report-header">
  <div class="report-header-inner">
    <h1>Farm Transition Report</h1>
    <p>Source: Transition_Summary.csv &nbsp;·&nbsp; 5 reporting periods &nbsp;·&nbsp; 79,718 rows &nbsp;·&nbsp; Grower IDs normalised across all RPs</p>
  </div>
</div>

<div class="report-body">

  <div class="picker-wrap">
    <div class="picker-group">
      <label>From</label>
      <div class="rp-btns" id="from-btns"></div>
    </div>
    <div class="picker-arrow">→</div>
    <div class="picker-group">
      <label>To</label>
      <div class="rp-btns" id="to-btns"></div>
    </div>
    <div class="compare-label" id="compare-label">RP 1 → RP 2</div>
  </div>

  <div class="legend">
    <span class="leg"><span class="leg-dot" style="background:var(--add-bg);border:1px solid var(--add-bd)"></span>New / added</span>
    <span class="leg"><span class="leg-dot" style="background:var(--frem-bg);border:1px solid var(--frem-bd)"></span>Left entirely</span>
    <span class="leg"><span class="leg-dot" style="background:var(--prem-bg);border:1px solid var(--prem-bd)"></span>Partially reduced</span>
    <span class="leg"><span class="leg-dot" style="background:var(--same-bg);border:1px solid var(--same-bd)"></span>Retained / unchanged</span>
  </div>

  <div id="dashboard"></div>
  <div class="generated-note">Generated May 2026</div>
</div>

<script>
const allPairs = {
  "1_2": {"growersAdded":264,"growersFullRem":15,"growersPartRem":42,"growersUnchanged":118,"fieldsAdded":4007,"fieldsFullRem":58,"fieldsPartRem":59,"fieldsSame":1065,"acresAdded":333937.6,"acresFullRem":5139.0,"acresPartRem":6268.7,"acresSame":88890.6,"acresNet":322739.2,"acresChangedCount":61,"creditsAdded":96806.9,"creditsFullRem":1236.93,"creditsPartRem":880.42,"creditsSame":14471.18,"creditsNet":86433.62,"totalGrowersA":175,"totalGrowersB":424},
  "1_3": {"growersAdded":814,"growersFullRem":17,"growersPartRem":59,"growersUnchanged":99,"fieldsAdded":14788,"fieldsFullRem":95,"fieldsPartRem":124,"fieldsSame":963,"acresAdded":1208664.5,"acresFullRem":7019.4,"acresPartRem":13444.9,"acresSame":79852.6,"acresNet":1188428.2,"acresChangedCount":51,"creditsAdded":149542.7,"creditsFullRem":2297.11,"creditsPartRem":2679.93,"creditsSame":13366.55,"creditsNet":138064.8,"totalGrowersA":175,"totalGrowersB":972},
  "1_4": {"growersAdded":946,"growersFullRem":34,"growersPartRem":41,"growersUnchanged":100,"fieldsAdded":19329,"fieldsFullRem":187,"fieldsPartRem":92,"fieldsSame":903,"acresAdded":1443369.7,"acresFullRem":16822.5,"acresPartRem":9829.3,"acresSame":73317.0,"acresNet":1416597.7,"acresChangedCount":76,"creditsAdded":597861.91,"creditsFullRem":3699.53,"creditsPartRem":1629.99,"creditsSame":32157.19,"creditsNet":605174.64,"totalGrowersA":175,"totalGrowersB":1087},
  "1_5": {"growersAdded":1283,"growersFullRem":34,"growersPartRem":35,"growersUnchanged":106,"fieldsAdded":36501,"fieldsFullRem":180,"fieldsPartRem":83,"fieldsSame":919,"acresAdded":2385700.3,"acresFullRem":14833.0,"acresPartRem":7268.5,"acresSame":75347.2,"acresNet":2360958.5,"acresChangedCount":141,"creditsAdded":1157317.06,"creditsFullRem":4174.27,"creditsPartRem":1579.32,"creditsSame":28842.52,"creditsNet":1161315.13,"totalGrowersA":175,"totalGrowersB":1424},
  "2_3": {"growersAdded":564,"growersFullRem":16,"growersPartRem":187,"growersUnchanged":221,"fieldsAdded":11541,"fieldsFullRem":93,"fieldsPartRem":769,"fieldsSame":4210,"acresAdded":946762.5,"acresFullRem":4817.5,"acresPartRem":76043.3,"acresSame":341754.7,"acresNet":865688.9,"acresChangedCount":2,"creditsAdded":100128.52,"creditsFullRem":1509.03,"creditsPartRem":16689.06,"creditsSame":62780.73,"creditsNet":51631.17,"totalGrowersA":424,"totalGrowersB":972},
  "2_4": {"growersAdded":722,"growersFullRem":59,"growersPartRem":127,"growersUnchanged":238,"fieldsAdded":16173,"fieldsFullRem":553,"fieldsPartRem":460,"fieldsSame":4059,"acresAdded":1179273.1,"acresFullRem":38762.1,"acresPartRem":45791.4,"acresSame":337413.6,"acresNet":1093858.5,"acresChangedCount":99,"creditsAdded":471142.44,"creditsFullRem":9917.82,"creditsPartRem":9137.82,"creditsSame":158876.65,"creditsNet":518741.02,"totalGrowersA":424,"totalGrowersB":1087},
  "2_5": {"growersAdded":1085,"growersFullRem":85,"growersPartRem":121,"growersUnchanged":218,"fieldsAdded":33455,"fieldsFullRem":640,"fieldsPartRem":467,"fieldsSame":3965,"acresAdded":2140951.9,"acresFullRem":49024.5,"acresPartRem":41144.5,"acresSame":320095.5,"acresNet":2038219.3,"acresChangedCount":727,"creditsAdded":1062755.07,"creditsFullRem":11518.59,"creditsPartRem":8226.85,"creditsSame":123404.52,"creditsNet":1074881.51,"totalGrowersA":424,"totalGrowersB":1424},
  "3_4": {"growersAdded":314,"growersFullRem":199,"growersPartRem":224,"growersUnchanged":549,"fieldsAdded":7961,"fieldsFullRem":2594,"fieldsPartRem":886,"fieldsSame":12271,"acresAdded":621747.3,"acresFullRem":315050.2,"acresPartRem":76921.0,"acresSame":894939.4,"acresNet":228169.6,"acresChangedCount":232,"creditsAdded":306971.43,"creditsFullRem":26019.1,"creditsPartRem":8887.95,"creditsSame":323047.66,"creditsNet":467109.84,"totalGrowersA":972,"totalGrowersB":1087},
  "3_5": {"growersAdded":741,"growersFullRem":289,"growersPartRem":233,"growersUnchanged":450,"fieldsAdded":25408,"fieldsFullRem":2731,"fieldsPartRem":1008,"fieldsSame":12012,"acresAdded":1547308.1,"acresFullRem":257264.4,"acresPartRem":93469.4,"acresSame":913739.4,"acresNet":1172530.4,"acresChangedCount":1947,"creditsAdded":841411.64,"creditsFullRem":30570.64,"creditsPartRem":10425.32,"creditsSame":344747.95,"creditsNet":1023250.33,"totalGrowersA":972,"totalGrowersB":1424},
  "4_5": {"growersAdded":495,"growersFullRem":158,"growersPartRem":283,"growersUnchanged":646,"fieldsAdded":19783,"fieldsFullRem":1482,"fieldsPartRem":1113,"fieldsSame":17637,"acresAdded":1185284.6,"acresFullRem":120105.0,"acresPartRem":84086.5,"acresSame":1275762.9,"acresNet":944360.8,"acresChangedCount":2695,"creditsAdded":790626.29,"creditsFullRem":47856.24,"creditsPartRem":40783.93,"creditsSame":395533.29,"creditsNet":556140.49,"totalGrowersA":1087,"totalGrowersB":1424}
};

const ID_NOTE = 'Grower IDs changed format between RP 2 and RP 3. The DEPRECATED_GROWER_ID ↔ GROWER_ID mapping table was used to resolve 408 of 424 RP 2 growers to their new IDs. The 16 unresolved growers are counted as fully removed.';

let fromRP = 1, toRP = 2;

function buildPicker(containerId, selectedVal, onSelect) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.className = 'rp-btn' + (i === selectedVal ? ' active' : '');
    b.textContent = i;
    b.onclick = () => onSelect(i);
    wrap.appendChild(b);
  }
}

function refreshPickers() {
  buildPicker('from-btns', fromRP, val => {
    fromRP = val;
    if (toRP <= fromRP) toRP = Math.min(fromRP + 1, 5);
    refreshPickers(); render();
  });
  buildPicker('to-btns', toRP, val => {
    toRP = val;
    if (toRP <= fromRP) fromRP = Math.max(toRP - 1, 1);
    refreshPickers(); render();
  });
  document.querySelectorAll('#from-btns .rp-btn').forEach((b, i) => { b.disabled = (i + 1) >= 5; });
  document.querySelectorAll('#to-btns .rp-btn').forEach((b, i)   => { b.disabled = (i + 1) <= fromRP; });
  document.getElementById('compare-label').textContent = `RP ${fromRP} → RP ${toRP}`;
}

function fmt(n)    { return Math.round(n).toLocaleString(); }
function fmtC(n)   { // credits: show 1 decimal, with sign awareness
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (abs >= 1000)    return (n/1000).toFixed(1) + 'k';
  return n.toFixed(1);
}
function fmtA(n)   {
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (abs >= 1000)    return (n/1000).toFixed(1) + 'k';
  return Math.round(n).toLocaleString();
}
function fmtNet(n) { return (n > 0 ? '+' : '') + fmtA(n); }
function fmtNetC(n){ return (n > 0 ? '+' : '') + fmtC(n); }
function nc(n)     { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'zer'; }

function render() {
  const key = `${fromRP}_${toRP}`;
  const s = allPairs[key];
  if (!s) return;

  const fieldsA = s.fieldsSame + s.fieldsFullRem + s.fieldsPartRem;
  const fieldsB = s.fieldsSame + s.fieldsAdded;
  const showNote = (fromRP <= 2 && toRP >= 3);

  document.getElementById('dashboard').innerHTML = `

    <div class="section-block">
      <div class="sec-label">Growers &nbsp;·&nbsp; ${fmt(s.totalGrowersA)} → ${fmt(s.totalGrowersB)}</div>
      <div class="card-row">
        <div class="mcard c-add">
          <div class="mlabel">New growers</div>
          <div class="mval">${fmt(s.growersAdded)}</div>
          <div class="msub">joined this period</div>
        </div>
        <div class="mcard c-frem">
          <div class="mlabel">Left entirely</div>
          <div class="mval">${fmt(s.growersFullRem)}</div>
          <div class="msub">all fields removed</div>
        </div>
        <div class="mcard c-prem">
          <div class="mlabel">Partially reduced</div>
          <div class="mval">${fmt(s.growersPartRem)}</div>
          <div class="msub">some fields removed</div>
        </div>
        <div class="mcard c-same">
          <div class="mlabel">Unchanged</div>
          <div class="mval">${fmt(s.growersUnchanged)}</div>
          <div class="msub">no field changes</div>
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="sec-label">Fields &nbsp;·&nbsp; ${fmt(fieldsA)} → ${fmt(fieldsB)}</div>
      <div class="card-row">
        <div class="mcard c-add">
          <div class="mlabel">Added</div>
          <div class="mval">${fmt(s.fieldsAdded)}</div>
          <div class="msub">new fields</div>
        </div>
        <div class="mcard c-frem">
          <div class="mlabel">Lost with grower</div>
          <div class="mval">${fmt(s.fieldsFullRem)}</div>
          <div class="msub">grower left entirely</div>
        </div>
        <div class="mcard c-prem">
          <div class="mlabel">Partially removed</div>
          <div class="mval">${fmt(s.fieldsPartRem)}</div>
          <div class="msub">grower still active</div>
        </div>
        <div class="mcard c-same">
          <div class="mlabel">Retained</div>
          <div class="mval">${fmt(s.fieldsSame)}</div>
          <div class="msub">${s.acresChangedCount > 0 ? fmt(s.acresChangedCount) + ' with acreage change' : 'no acreage changes'}</div>
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="sec-label">Acres</div>
      <div class="card-row">
        <div class="mcard c-add">
          <div class="mlabel">Added</div>
          <div class="mval mval-sm">${fmtA(s.acresAdded)}</div>
          <div class="msub">acres gained</div>
        </div>
        <div class="mcard c-frem">
          <div class="mlabel">Lost with grower</div>
          <div class="mval mval-sm">${fmtA(s.acresFullRem)}</div>
          <div class="msub">grower left entirely</div>
        </div>
        <div class="mcard c-prem">
          <div class="mlabel">Partially removed</div>
          <div class="mval mval-sm">${fmtA(s.acresPartRem)}</div>
          <div class="msub">grower still active</div>
        </div>
        <div class="mcard c-same">
          <div class="mlabel">Retained</div>
          <div class="mval mval-sm">${fmtA(s.acresSame)}</div>
          <div class="msub">continuing acres</div>
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="sec-label">Credits</div>
      <div class="card-row">
        <div class="mcard c-add">
          <div class="mlabel">Added</div>
          <div class="mval mval-sm">${fmtC(s.creditsAdded)}</div>
          <div class="msub">credits gained</div>
        </div>
        <div class="mcard c-frem">
          <div class="mlabel">Lost with grower</div>
          <div class="mval mval-sm">${fmtC(s.creditsFullRem)}</div>
          <div class="msub">grower left entirely</div>
        </div>
        <div class="mcard c-prem">
          <div class="mlabel">Partially removed</div>
          <div class="mval mval-sm">${fmtC(s.creditsPartRem)}</div>
          <div class="msub">grower still active</div>
        </div>
        <div class="mcard c-same">
          <div class="mlabel">Retained</div>
          <div class="mval mval-sm">${fmtC(s.creditsSame)}</div>
          <div class="msub">continuing credits</div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="sec-label">Net change · RP ${fromRP} → RP ${toRP}</div>
    <div class="net-row">
      <div class="ncard">
        <div class="nlabel">Growers</div>
        <div class="nval ${nc(s.growersAdded - s.growersFullRem)}">${fmtNet(s.growersAdded - s.growersFullRem)}</div>
      </div>
      <div class="ncard">
        <div class="nlabel">Fields</div>
        <div class="nval ${nc(s.fieldsAdded - s.fieldsFullRem - s.fieldsPartRem)}">${fmtNet(s.fieldsAdded - s.fieldsFullRem - s.fieldsPartRem)}</div>
      </div>
      <div class="ncard">
        <div class="nlabel">Acres</div>
        <div class="nval ${nc(s.acresNet)}">${fmtNet(s.acresNet)}</div>
      </div>
      <div class="ncard">
        <div class="nlabel">Credits</div>
        <div class="nval ${nc(s.creditsNet)}">${fmtNetC(s.creditsNet)}</div>
      </div>
    </div>

    ${showNote ? `<div class="note"><strong>Note · </strong>${ID_NOTE}</div>` : ''}
  `;
}

refreshPickers();
render();
</script>
</body>
</html>
